{{ ^disableComments }}
# This is an example {{ mods_toml_file }} file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# Find the full neoforge.mods.toml documentation here: https://docs.neoforged.net/docs/gettingstarted/modfiles/
{{ /disableComments }}

{{ #before_1_21_5 }}
{{ ^disableComments }}
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
{{ /disableComments }}
modLoader="javafml" #mandatory

{{ ^disableComments }}
# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
{{ /disableComments }}
loaderVersion="${loader_version_range}" #mandatory

{{ /before_1_21_5 }}
{{ #from_1_21_5 }}
{{ ^minimal }}
{{ ^disableComments }}
# The language loader used by this mod. The default and recommended value is "javafml" for Java mods.
{{ #before_1_21_6 }}
# You can also use "lowcodefml" for data pack or resource pack mods with no Java entrypoint.
# See https://docs.neoforged.net/docs/1.21.5/gettingstarted/modfiles/#non-mod-specific-properties
{{ /before_1_21_6 }}
{{ #from_1_21_6 }}
# Other values are supplied by third-party language loaders.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#non-mod-specific-properties
{{ /from_1_21_6 }}
{{ /disableComments }}
#modLoader="javafml" #optional

{{ ^disableComments }}
# The acceptable language loader versions, expressed as a Maven version range. An empty string allows any version.
# The current "javafml"{{ #before_1_21_6 }} and "lowcodefml" loaders are{{ /before_1_21_6 }}{{ #from_1_21_6 }} loader is{{ /from_1_21_6 }} version 1.
# See https://maven.apache.org/enforcer/enforcer-rules/versionRanges.html
{{ /disableComments }}
#loaderVersion="[1,)" #optional

{{ /minimal }}
{{ /from_1_21_5 }}
{{ ^disableComments }}
# The license for your mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
{{ /disableComments }}
license="${mod_license}"
{{ ^minimal }}

{{ #from_26_2 }}
{{ ^disableComments }}
# An absolute URL for the license text shown in the mod list
{{ /disableComments }}
#licenseURL="https://change.me.to.your.license.example.invalid/" #optional
{{ /from_26_2 }}

{{ ^disableComments }}
# A URL to refer people to when problems occur with this mod
{{ /disableComments }}
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

{{ ^disableComments }}
# Whether the mod's resources should be shown as a separate resource pack.
# true shows them separately in the Resource Packs menu; false uses the combined "Mod Resources" pack (default).
{{ /disableComments }}
#showAsResourcePack=false #optional

{{ ^disableComments }}
# Whether the mod's data should be shown as a separate data pack.
# true shows it separately in the Data Packs menu; false uses the combined "Mod Data" pack (default).
{{ /disableComments }}
#showAsDataPack=false #optional

{{ ^disableComments }}
# A list of fully-qualified service interface names used by the mod's Java module.
# This is equivalent to the Java module system's "uses" directive.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#non-mod-specific-properties
{{ /disableComments }}
#services=["{{ package_name }}.ExampleService"] #optional

{{ ^disableComments }}
# File-wide key-value substitution properties. Reference a value elsewhere as ${file.<key>}.
# Values may be any valid TOML value. See https://docs.neoforged.net/docs/gettingstarted/modfiles/#non-mod-specific-properties
{{ /disableComments }}
#properties={exampleProperty="exampleValue"} #optional
{{ /minimal}}

{{ ^disableComments }}
# A list of mods - how many allowed here is determined by the individual mod loader
{{ /disableComments }}
[[mods]] #mandatory

{{ ^disableComments }}
# The modid of the mod
{{ /disableComments }}
modId="${mod_id}" #mandatory

{{ ^minimal }}
{{ ^disableComments }}
# An override namespace for the mod. The default is the mod id, and this field is currently unused.
# The value follows mod-id rules but may also contain dots and dashes.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#mod-specific-properties
{{ /disableComments }}
#namespace="${mod_id}" #optional
{{ /minimal }}

{{ ^disableComments }}
# The version number of the mod
{{ /disableComments }}
version="${mod_version}" #mandatory

{{ ^disableComments }}
# A display name for the mod
{{ /disableComments }}
displayName="${mod_name}" #mandatory
{{ ^minimal }}

{{ ^disableComments }}
# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
{{ /disableComments }}
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

{{ ^disableComments }}
# A URL for the "homepage" for this mod, displayed in the mod UI
{{ /disableComments }}
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

{{ ^disableComments }}
# An absolute URL for the download page of this mod. This field is currently unused.
{{ /disableComments }}
#modUrl="https://change.me.to.your.mods.download.example.invalid/" #optional

{{ #before_26_2 }}
{{ ^disableComments }}
# The path from the root of the mod JAR to the logo shown in the mod list.
# Valid path characters are lowercase letters, digits, slashes, underscores, periods, and hyphens.
{{ /disableComments }}
#logoFile="examplemod.png" #optional

{{ ^disableComments }}
# How to scale the logo: true uses linear filtering for a smooth image; false uses nearest-neighbor filtering.
{{ /disableComments }}
#logoBlur=true #optional
{{ /before_26_2 }}
{{ #from_26_2 }}
{{ ^disableComments }}
# A file name relative to the root of the mod JAR, or a namespaced resource location,
# for the rectangular banner shown in the mod list.
{{ /disableComments }}
#bannerFile="examplemod_banner.png" #optional

{{ ^disableComments }}
# A file name relative to the root of the mod JAR, or a namespaced resource location,
# for the square icon shown in the mod list.
{{ /disableComments }}
#iconFile="examplemod_icon.png" #optional

{{ ^disableComments }}
# How to scale the icon: true uses linear filtering for a smooth image; false uses nearest-neighbor filtering.
{{ /disableComments }}
#iconBlur=false #optional
{{ /from_26_2 }}

{{ ^disableComments }}
# A text field displayed in the mod UI
{{ /disableComments }}
#credits="" #optional

{{ ^disableComments }}
# The path from the root of the mod JAR to a JSON file containing enum extension declarations.
# See https://docs.neoforged.net/docs/advanced/extensibleenums/
{{ /disableComments }}
#enumExtensions="META-INF/enumextensions.json" #optional

{{ #from_1_21_1 }}
{{ ^disableComments }}
# The path from the root of the mod JAR to a JSON file containing custom feature flag declarations.
# See https://docs.neoforged.net/docs/advanced/featureflags/
{{ /disableComments }}
#featureFlags="META-INF/feature_flags.json" #optional
{{ /from_1_21_1 }}
{{ /minimal }}

{{ ^disableComments }}
# The authors of the mod, displayed in the mod UI (optional)
{{ /disableComments }}
{{ #has_authors }}
authors="{{ mod_authors }}"
{{ /has_authors }}
{{ ^has_authors }}
#authors=""
{{ /has_authors }}

{{ ^disableComments }}
# The description text for the mod (multi line!) (#mandatory)
{{ /disableComments }}
description='''
{{ mod_description }}
'''

{{ ^disableComments }}
# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
{{ /disableComments }}
{{ #mixins }}
[[mixins]]
config="${mod_id}.mixins.json"
{{ #from_1_21_1 }}
{{ ^minimal }}
{{ ^disableComments }}
# A list of mod ids that must be loaded for this mixin configuration to be applied. The default is an empty list.
{{ /disableComments }}
#requiredMods=["anothermod"] #optional
{{ /minimal }}
{{ /from_1_21_1 }}
{{ #from_1_21_7 }}
{{ ^minimal }}
{{ ^disableComments }}
# The Fabric Mixin version whose behavior this configuration expects. Omit it to use NeoForge's default behavior version.
# The value must be between NeoForge's default behavior version and its bundled Mixin version.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#mixin-configuration-properties
{{ /disableComments }}
#behaviorVersion="0.17.1" #optional
{{ /minimal }}
{{ /from_1_21_7 }}
{{ /mixins }}
{{ ^mixins }}
#[[mixins]]
#config="${mod_id}.mixins.json"
{{ #from_1_21_1 }}
{{ ^minimal }}
{{ ^disableComments }}
# A list of mod ids that must be loaded for this mixin configuration to be applied. The default is an empty list.
{{ /disableComments }}
#requiredMods=["anothermod"] #optional
{{ /minimal }}
{{ /from_1_21_1 }}
{{ #from_1_21_7 }}
{{ ^minimal }}
{{ ^disableComments }}
# The Fabric Mixin version whose behavior this configuration expects. Omit it to use NeoForge's default behavior version.
# The value must be between NeoForge's default behavior version and its bundled Mixin version.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#mixin-configuration-properties
{{ /disableComments }}
#behaviorVersion="0.17.1" #optional
{{ /minimal }}
{{ /from_1_21_7 }}
{{ /mixins }}

{{ ^disableComments }}
# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
{{ /disableComments }}
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

{{ ^disableComments }}
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
{{ /disableComments }}
[[dependencies.${mod_id}]] #optional
{{ ^disableComments }}
    # the modid of the dependency
{{ /disableComments }}
    modId="neoforge" #mandatory
{{ ^disableComments }}
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
{{ /disableComments }}
    type="required" #mandatory
{{ ^disableComments }}
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
{{ /disableComments }}
    versionRange="[${neo_version},)" #mandatory
{{ ^disableComments }}
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
{{ /disableComments }}
    ordering="NONE"
{{ ^disableComments }}
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
{{ /disableComments }}
    side="BOTH"
{{ ^minimal }}
{{ ^disableComments }}
    # An absolute URL for the dependency's download page. This field is currently unused.
{{ /disableComments }}
    #referralUrl="https://library.example.invalid/" #optional
{{ /minimal }}

{{ ^disableComments }}
# Here's another dependency
{{ /disableComments }}
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
{{ ^disableComments }}
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
{{ /disableComments }}
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
{{ ^minimal }}

{{ ^disableComments }}
# Features are specific properties of the game environment that your mod may require. Values are Maven version ranges.
{{ #before_1_21_5 }}
# This example requires OpenGL 3.2 or newer. Supported keys are javaVersion and openGLVersion.
# See https://docs.neoforged.net/docs/1.21.4/gettingstarted/modfiles/#features
{{ /before_1_21_5 }}
{{ #from_1_21_5 }}
# This example requires Java {{ java_version }} or newer. The supported key is javaVersion.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#features
{{ /from_1_21_5 }}
{{ /disableComments }}
#[features.${mod_id}]
{{ #before_1_21_5 }}
#openGLVersion="[3.2,)"
{{ /before_1_21_5 }}
{{ #from_1_21_5 }}
#javaVersion="[{{ java_version }},)"
{{ /from_1_21_5 }}

{{ ^disableComments }}
# Arbitrary mod-specific key-value properties. Values may be any valid TOML value.
# Read them through IModInfo#getModProperties.
# See https://docs.neoforged.net/docs/gettingstarted/modfiles/#mod-properties
{{ /disableComments }}
#[modproperties.${mod_id}]
#exampleProperty="exampleValue"
{{ /minimal }}
